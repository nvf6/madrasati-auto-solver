name: Auto Solve Madrasati Assignments

on:
  schedule:
    - cron: '0 17 * * *'
  workflow_dispatch:

jobs:
  run-script:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          playwright install --with-deps chromium

      - name: Run Madrasati Auto Solver
        env:
          MADRASATI_EMAIL: ${{ secrets.MADRASATI_EMAIL }}
          MADRASATI_PASSWORD: ${{ secrets.MADRASATI_PASSWORD }}
        run: |
          python main.py
